name: Build and publish image

# Images are published when a GitHub release is published: :latest always matches the newest
# full release, and each release also gets its own version tag (v1.5.0 / V1.5.0 -> :1.5.0).
# Pre-releases get only their version tag. Pull requests are built to check they still build,
# but nothing is pushed. Run it by hand on a tag to rebuild that release's image.
on:
  release:
    types: [published]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Two releases published close together must not race each other for :latest.
concurrency:
  group: docker-publish-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing is published unless typecheck, lint and the test suite pass.
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out image tags
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image=ghcr.io/revise0592/carvey
          if [[ "$EVENT" == "pull_request" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=${image}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Run this on a release tag, not a branch (Use workflow from: Tags)."
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#[vV]}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # The image reports the tag's version (CARVEY_VERSION), so a stale package.json can't make
          # a release show the wrong number. Still flag it, so the source stays in step.
          package_version="$(jq -r .version package.json)"
          if [[ "$package_version" != "$version" ]]; then
            echo "::warning title=package.json version::package.json says ${package_version} but this release is ${version}. The image will report ${version}; bump package.json in the next commit."
          fi
          tags="${image}:${version}"
          if [[ "$PRERELEASE" != "true" ]]; then
            tags="${tags},${image}:latest"
          fi
          echo "push=true" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CARVEY_VERSION=${{ steps.meta.outputs.version }}
            CARVEY_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Carvey
            org.opencontainers.image.description=Self-hosted car maintenance dashboard
            org.opencontainers.image.source=https://github.com/Revise0592/Carvey
            org.opencontainers.image.version=${{ steps.meta.outputs.version || github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
